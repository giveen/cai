services:
  cai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cai
    network_mode: host
    privileged: true
    
    # VPN Capabilities (Crucial for the HTB Refactor)
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun

    volumes:
      - ./config/.env:/config/.env:ro
      - ./logs:/opt/cai/logs
      - ./workspaces:/workspace # Bind mount for Principal and other HTB states
    
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - QDRANT_HOST=localhost # Since network_mode is host
      - CAI_WEB=true
      - TEXTUAL_WEB_HOST=0.0.0.0
    
    stdin_open: true
    tty: true
    restart: unless-stopped
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:latest
    container_name: cai-qdrant
    network_mode: host # Matches CAI for easy local communication
    volumes:
      - ./qdrant_data:/qdrant/storage # Keeps your vector memory alive
    restart: unless-stopped